name: TIMEORA CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install server dependencies
        working-directory: watch-store/server
        run: npm ci

      - name: Install client dependencies
        working-directory: watch-store/client
        run: npm ci

      - name: Run server tests
        working-directory: watch-store/server
        run: node test/runTests.js
        env:
          MONGO_URI: mongodb://localhost:27017/timeora_watches_test
          JWT_SECRET: test-secret-key-min-32-chars
          NODE_ENV: test

      - name: Lint server
        working-directory: watch-store/server
        run: npx eslint . --ext .js 2>/dev/null || echo "Lint skipped (no config)"

      - name: Build frontend
        working-directory: watch-store/client
        run: npm run build

      - name: Typecheck frontend
        working-directory: watch-store/client
        run: npx tsc --noEmit 2>/dev/null || echo "Typecheck skipped (no tsconfig)"
